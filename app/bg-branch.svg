  <use xlink:href="#flower-light" transform="translate(250 50) scale(1)"/>
  <use xlink:href="#flower" transform="translate(208 64) scale(1.15) rotate(20)"/>
  <use xlink:href="#flower-light" transform="translate(196 122) scale(1.05)"/>

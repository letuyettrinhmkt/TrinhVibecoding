  <use xlink:href="#flower" transform="translate(98 30) scale(1.1) rotate(10)"/>
  <use xlink:href="#flower-light" transform="translate(132 40) scale(0.85)"/>
  <use xlink:href="#flower" transform="translate(110 88) scale(1.2) rotate(35)"/>

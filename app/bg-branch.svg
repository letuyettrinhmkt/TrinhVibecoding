  <use xlink:href="#flower" transform="translate(50 124) scale(0.95)"/>
  <use xlink:href="#flower-light" transform="translate(20 92) scale(0.8)"/>
  <use xlink:href="#flower" transform="translate(262 112) scale(0.9) rotate(-25)"/>
  <use xlink:href="#bud" transform="translate(232 30) rotate(-30)"/>
  <use xlink:href="#bud" transform="translate(146 58) rotate(15)"/>
  <use xlink:href="#bud" transform="translate(84 140) rotate(40)"/>

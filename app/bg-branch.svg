<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 230">
  <defs>
    <!-- Bông đào 5 cánh -->
    <g id="flower">
      <g fill="#F9B9DD" stroke="#FE68C6" stroke-width="0.8">
        <circle cx="0" cy="-7" r="7"/>
        <circle cx="6.66" cy="-2.16" r="7"/>
        <circle cx="4.11" cy="5.66" r="7"/>
        <circle cx="-4.11" cy="5.66" r="7"/>
        <circle cx="-6.66" cy="-2.16" r="7"/>
      </g>
      <circle r="4.2" fill="#EB2F96"/>
      <circle r="1.8" fill="#FFE08A"/>
    </g>
    <g id="flower-light">
      <g fill="#FCDDEF" stroke="#F9B9DD" stroke-width="0.8">
        <circle cx="0" cy="-7" r="7"/>
        <circle cx="6.66" cy="-2.16" r="7"/>
        <circle cx="4.11" cy="5.66" r="7"/>
        <circle cx="-4.11" cy="5.66" r="7"/>
        <circle cx="-6.66" cy="-2.16" r="7"/>
      </g>
